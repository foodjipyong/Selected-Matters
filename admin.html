<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>실적 DB 관리자 · 수임제안서 자동입력기</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Malgun Gothic','Apple SD Gothic Neo',sans-serif; background: #f5f5f0; color: #1a1a1a; font-size: 14px; }
header { background: #1a3a5c; color: #fff; padding: 16px 26px; display: flex; justify-content: space-between; align-items: center; }
header h1 { font-size: 16px; font-weight: 700; }
header .count { font-size: 12px; color: #cfe0f0; }
.wrap { max-width: 1150px; margin: 0 auto; padding: 22px 24px 60px; }

.notice {
  background: #fffbe6; border: 1px solid #ffe066; border-radius: 6px; padding: 12px 16px;
  font-size: 12.5px; color: #7a6100; line-height: 1.7; margin-bottom: 16px;
}
.notice code { background: #fff3b0; padding: 1px 5px; border-radius: 3px; font-family: monospace; }

.bar { display: flex; gap: 10px; margin-bottom: 14px; align-items: center; flex-wrap: wrap; }
button {
  border: none; border-radius: 6px; padding: 9px 16px; font-size: 13px; cursor: pointer;
  font-family: inherit; font-weight: 600;
}
.btn-primary { background: #1a3a5c; color: #fff; }
.btn-primary:hover { background: #2c5f8a; }
.btn-secondary { background: #fff; border: 1px solid #ddd; color: #333; }
.btn-danger { background: #fff; border: 1px solid #c0392b; color: #c0392b; padding: 4px 9px; font-size: 12px; }
input[type=file] { display: none; }

table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e0ddd4; }
th, td { border: 1px solid #e0ddd4; padding: 7px 9px; font-size: 12.5px; vertical-align: top; }
th { background: #eef4fa; color: #1a3a5c; text-align: left; }
td select, td textarea, td input {
  width: 100%; border: 1px solid #ddd; border-radius: 4px; padding: 5px 7px; font-size: 12.5px; font-family: inherit;
}
td textarea { resize: vertical; min-height: 46px; }
td.no-col { width: 46px; text-align: center; color: #888; }
td.cat-col { width: 170px; }
td.actions-col { width: 64px; text-align: center; }
.status { font-size: 13px; color: #1a7a3a; margin-left: auto; }
</style>
</head>
<body>
<header>
  <h1>🗂 실적 DB 관리자</h1>
  <div class="count" id="countTxt"></div>
</header>
<div class="wrap">
  <div class="notice">
    서버의 <code>db.json</code>을 불러와 수정하고, 완료 후 <b>"db.json 다운로드"</b>를 눌러 받은 파일을
    서버의 <code>db.json</code> 위치에 덮어쓰면 <b>user.html</b>(직원용 검색 페이지)에 새로고침만으로 즉시 반영됩니다.
    재배포·재회람이 필요 없습니다.
  </div>
  <div class="bar">
    <button class="btn-secondary" onclick="document.getElementById('loadFile').click()">다른 JSON 불러오기</button>
    <input type="file" id="loadFile" accept=".json" onchange="onLoadFile(event)">
    <button class="btn-secondary" onclick="addRow()">+ 실적 추가</button>
    <button class="btn-primary" onclick="downloadJson()">⬇ db.json 다운로드</button>
    <span class="status" id="statusMsg"></span>
  </div>
  <table>
    <thead>
      <tr><th style="width:46px;">No</th><th style="width:170px;">분야</th><th>실적 내용 (perf)</th><th style="width:64px;">삭제</th></tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script>
const CATEGORIES = ["건설부동산 일반","건설행정","건설환경","공공계약 민간투자",
  "도시정비 도시개발","부동산신탁 PF분쟁","수용보상 감정평가","해외건설"];

let DATA = [];

async function loadInitial() {
  try {
    const res = await fetch('db.json?t=' + Date.now());
    DATA = await res.json();
  } catch (e) {
    DATA = [];
  }
  render();
}
loadInitial();

function onLoadFile(e) {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      DATA = JSON.parse(ev.target.result);
      render();
      setStatus('불러오기 완료: ' + f.name);
    } catch (err) {
      alert('JSON 파싱 오류: ' + err.message);
    }
  };
  reader.readAsText(f, 'utf-8');
}

function setStatus(msg) {
  document.getElementById('statusMsg').textContent = msg;
  setTimeout(() => { document.getElementById('statusMsg').textContent = ''; }, 3000);
}

function catOptions(selected) {
  return CATEGORIES.map(c => `<option value="${c}" ${c === selected ? 'selected' : ''}>${c}</option>`).join('');
}

function escapeHtml(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function render() {
  document.getElementById('countTxt').textContent = `총 ${DATA.length}건`;
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = DATA.map((r, i) => `
    <tr>
      <td class="no-col">${i + 1}</td>
      <td class="cat-col"><select onchange="updateField(${i}, 'cat', this.value)">${catOptions(r.cat)}</select></td>
      <td><textarea oninput="updateField(${i}, 'perf', this.value)">${escapeHtml(r.perf)}</textarea></td>
      <td class="actions-col"><button class="btn-danger" onclick="removeRow(${i})">삭제</button></td>
    </tr>
  `).join('');
}

function updateField(idx, field, value) {
  DATA[idx][field] = value;
}

function addRow() {
  const nextNo = DATA.length ? Math.max(...DATA.map(r => parseInt(r.no) || 0)) + 1 : 1;
  DATA.push({ no: String(nextNo), cat: CATEGORIES[0], sub: '', perf: '' });
  render();
  window.scrollTo(0, document.body.scrollHeight);
}

function removeRow(idx) {
  if (!confirm('이 실적을 삭제하시겠습니까?')) return;
  DATA.splice(idx, 1);
  render();
}

function downloadJson() {
  DATA.forEach((r, i) => { r.no = String(i + 1); });
  const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'db.json';
  a.click();
  URL.revokeObjectURL(url);
  setStatus('다운로드 완료 — 서버의 db.json에 덮어써 주세요');
}
</script>
</body>
</html>
